<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ead7c7" />
  <title>Arayın — +90 538 657 7014</title>
  <style>
    :root{
      --nude-1: #fbf6f2;
      --nude-2: #f4e7dc;
      --nude-3: #e9d2bb;
      --accent: #c9a98a;
      --text: #3b2b26;
      --muted: #7b6459;
      --radius: 16px;
      --shadow: 0 8px 24px rgba(59,43,38,0.12);
      font-family: "Inter", "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial;
    }

    html,body{
      height:100%;
      margin:0;
      background: linear-gradient(180deg, var(--nude-1) 0%, var(--nude-2) 100%);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .wrap{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
      box-sizing:border-box;
    }

    .card{
      width:100%;
      max-width:420px;
      background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.36));
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:28px;
      text-align:center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(201,169,138,0.14);
    }

    .label{
      font-size:13px;
      color:var(--muted);
      letter-spacing:0.04em;
      margin-bottom:10px;
      display:block;
    }

    .phone{
      display:inline-block;
      font-size:28px;
      font-weight:600;
      color:var(--text);
      margin:10px 0 20px 0;
      word-break:break-word;
    }

    .call-btn{
      display:inline-flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      background: linear-gradient(180deg, var(--accent), #b98868);
      color:white;
      padding:14px 20px;
      border-radius:12px;
      font-weight:600;
      box-shadow: 0 6px 18px rgba(185,130,95,0.18);
      transition: transform .14s ease, box-shadow .14s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .call-btn:active{ transform: translateY(1px) scale(.997); }
    .call-btn:focus{ outline:3px solid rgba(201,169,138,0.22); outline-offset:3px; }

    .muted-note{
      margin-top:16px;
      font-size:13px;
      color:var(--muted);
    }

    .copy-btn{
      margin-top:18px;
      display:inline-block;
      background:none;
      border: 1px solid rgba(59,43,38,0.08);
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
      color:var(--text);
    }

    /* Responsive tweaks */
    @media (max-width:420px){
      .card{ padding:22px; }
      .phone{ font-size:24px; }
      .call-btn{ padding:12px 16px; gap:10px; }
    }
  </style>
</head>
<body>
  <main class="wrap" role="main">
    <section class="card" aria-labelledby="callHeading">
      <span class="label" id="callHeading">Telefon</span>

      <!-- Telefon numarası görüntüsü -->
      <div class="phone" aria-hidden="false">+90 538 657 7014</div>

      <!-- 'tel:' link: mobilde arama başlatır -->
      <a class="call-btn" href="tel:+905386577014" aria-label="Bu numarayı aramak için tıkla">
        <!-- basit telefon ikonu (svg) -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 16.5v3a1.5 1.5 0 0 1-1.5 1.5C9.85 21 3 14.15 3 6.5A1.5 1.5 0 0 1 4.5 5h3A1.5 1.5 0 0 1 9 6.5c0 .8-.1 1.6-.3 2.3a1.5 1.5 0 0 1-.9.9l-1.2.5a13.5 13.5 0 0 0 6.9 6.9l.5-1.2a1.5 1.5 0 0 1 .9-.9c.7-.2 1.5-.3 2.3-.3A1.5 1.5 0 0 1 21 16.5z" fill="white"/>
        </svg>
        Arama Yap
      </a>

      <div class="muted-note">Mobilde tıklayınca arama ekranı açılır. Masaüstündeyseniz numarayı kopyalayabilirsiniz.</div>

      <button class="copy-btn" id="copyBtn" aria-label="Numarayı kopyala">Numarayı kopyala</button>
      <div id="copyStatus" style="margin-top:10px;font-size:13px;color:var(--muted);display:none;"></div>
    </section>
  </main>

  <script>
    (function(){
      const copyBtn = document.getElementById('copyBtn');
      const statusEl = document.getElementById('copyStatus');
      const phone = '+905386577014';

      copyBtn.addEventListener('click', async function(){
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(phone);
          } else {
            // fallback
            const ta = document.createElement('textarea');
            ta.value = phone;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          }
          statusEl.textContent = 'Numara panoya kopyalandı.';
          statusEl.style.display = 'block';
          setTimeout(()=> statusEl.style.display='none', 2400);
        } catch(e){
          statusEl.textContent = 'Kopyalama başarısız. Lütfen manuel kopyalayın.';
          statusEl.style.display = 'block';
        }
      });

      // İsteğe bağlı: cihaz bir telefon ise butonu daha öne çıkar (küçük UX iyileştirmesi)
      if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        copyBtn.style.display = 'none';
      }
    })();
  </script>
</body>
</html>
